<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="面向长期记忆研究的用户行为序列仿真系统">
  <title>BehaviorLab · 用户行为仿真系统</title>
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/gui-lab.css">
  <script type="module" src="/workspace.mjs"></script>
</head>
<body>
  <aside class="sidebar"><a class="brand" href="/" aria-label="BehaviorLab 首页"><span class="brand-mark">b<span>·</span></span><span>BehaviorLab<small>用户行为仿真系统</small></span></a><div class="workspace-name"><span>R</span><div>长期记忆研究<small>LOCAL WORKSPACE</small></div><span class="workspace-arrow">⌄</span></div><p class="nav-label">工作空间</p><nav id="navigation" aria-label="功能导航"></nav><div class="sidebar-foot"><div class="architecture-note"><i></i><span>架构与调度真实运行<small>模型与手机内容按模块 Mock</small></span></div><span>本地工作空间 <b>v0.3</b></span></div></aside>
  <div class="workspace"><header class="topbar"><div class="breadcrumb" id="breadcrumbs">工作空间 <span>/</span> <strong id="view-name">仿真任务</strong></div><div class="topbar-tools"><span class="connection" id="connection">● 本地已连接</span><span class="account">R</span></div></header><main id="main"><div class="loading">正在读取工作空间…</div></main><footer><span>BEHAVIORLAB · RESEARCH WORKSPACE</span><span>虚拟时间压缩推进 · 全部记录可追溯</span></footer></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="simulation-dialog" class="wide-dialog" aria-labelledby="simulation-title"><form id="simulation-form"><div class="dialog-head"><div><p class="eyebrow">NEW SIMULATION</p><h2 id="simulation-title">新建行为仿真任务</h2></div><button type="button" class="close" data-close="simulation-dialog" aria-label="关闭">×</button></div><label>任务名称<input name="name" required placeholder="例如：日常生活行为 · 第一组"></label><div class="form-section"><h3><span>01</span> 选择虚拟用户 <small>创建任务时保存固定人设快照</small></h3><div id="profile-picker" class="profile-picker"></div></div><div class="form-section"><h3><span>02</span> 设置虚拟时间跨度</h3><div class="span-presets" role="group" aria-label="时长跨度"> <button type="button" data-days="1">1 天</button><button type="button" data-days="7" class="selected">7 天</button><button type="button" data-days="30">30 天</button><button type="button" data-days="90">90 天</button><button type="button" data-days="365">1 年 · 365 天</button></div><div class="form-grid"><label>虚拟开始日期<input name="start_date" type="date" value="2026-01-01" required></label><label>跨度天数<input name="duration_days" type="number" value="7" min="1" required></label></div><p id="span-summary" class="hint"></p></div><div class="form-section"><h3><span>03</span> 指定可用 APP <small>候选能力配置，手机接入尚未完成</small></h3><div id="app-picker" class="app-picker"></div></div><label>行为生成要求（可选）<textarea name="requirements" rows="2" placeholder="额外的采集范围或任务约束"></textarea></label><details class="test-options"><summary>开发验证选项</summary><label class="inline-check"><input name="test_partial" type="checkbox"> 注入部分完成与局部调整</label><label class="inline-check"><input name="test_description_failure" type="checkbox"> 注入首次转文字失败</label></details><div class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" class="button" data-close="simulation-dialog">取消</button><button type="submit" class="button primary">创建仿真任务 →</button></div></form></dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-label="来源记录详情"><div id="detail-content"></div></dialog>
</body>
</html>
